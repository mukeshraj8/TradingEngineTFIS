      BULL_A_THRESHOLD: 205.0
      BULL_CF_B_THRESHOLD: 207.06
      REVERSAL_BULL_C_THRESHOLD: 200.99
    expected_final_status: null
    notes: "Uses stock a/b/c thresholds to prove they differ from the nifty defaults."

