    bearish_value: 177
    expected_candidates:
      BULL_A_THRESHOLD: true
      BEAR_A_THRESHOLD: false
      BULL_CF_B_THRESHOLD: false
      BEAR_CF_B_THRESHOLD: false
      REVERSAL_BULL_C_THRESHOLD: true
      REVERSAL_BEAR_C_THRESHOLD: false
