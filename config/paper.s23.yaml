# S23 FYERS live-paper ingress config.
# For a real market-hours run:
# - remove or comment broker.payload_fixture_path
# - export FYERS_APP_ID and FYERS_ACCESS_TOKEN
# - keep this file paper-only and ingress-only
source_mode: broker_fyers_live_paper_ingress

broker:
  provider: fyers
  timezone: Asia/Kolkata
  # Leave this set for deterministic smoke tests.
  # Remove it for a real FYERS market-data-only run.
  payload_fixture_path: ../tests/fixtures/paper/fyers_market_data_payloads.json
  capture_stream_events: false

paper:
  strategy_code: S23
  symbol: NIFTY
  contract_cycle: WEEKLY
  mode: paper
  operator_id: fyers-paper-ingress
  paper_mode_enabled: true
  same_day_square_off_only: true
  allow_recalculation: false
  allow_current_day_fsl_trp: true
  kill_switch_enabled: true
  session_kill_switch_active: false
  no_live_orders_allowed: true

market:
  underlying_symbol: NIFTY
  weekly_expiry: 2026-05-12
  # Smoke-test override only.
  # Operational paper selection should come from normalized option-chain records
  # plus strategy/trade-plan inputs, with OI validation enforced.
  selected_contract_symbol: NIFTY_20260512_25000_PE

costs:
  brokerage_per_lot: 20.0
  slippage_entry_points: 1.0
  slippage_exit_points: 1.0
  spread_buffer_policy: bid_ask_guard
  version_label: paper-cost-v1

thresholds:
  max_quote_age_seconds: 5.0
  max_timing_drift_seconds: 5.0
  max_stale_events: 0
  max_missing_chains: 0
  required_selected_contract_availability_ratio: 1.0
  max_no_trade_rate: 0.0
