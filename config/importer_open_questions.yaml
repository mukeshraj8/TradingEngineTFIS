open_questions:
  - id: s23_put_recalc_strike_ll_vs_high
    workbook_cells:
      - AB6 OS!M179
      - AB6 OS!O179
      - AB6 OS!M180
      - AB6 OS!O180
    description: >
      S23 Bull Put and Bear Put recalculated strike rows use MAX(...) wording
      while the displayed intraday label says 09:29:59 AM LL. The workbook
      wording does not make it fully clear whether the recalculated strike input
      should use the current-day low literally or the current-day high implied
      by the strike direction.
    current_behavior: >
      The diagnostic recalculation layer currently uses recalculation spot HIGH
      for put-branch strike recalculation. This is now treated as the
      confirmed workbook correction rather than an open ambiguity.
    alternative_interpretation: >
      Follow the workbook LL wording literally and use the recalculation spot
      LOW inside the MAX(...) strike formulas for Bull Put and Bear Put.
    resolution: >
      Confirmed correction: use recalculation spot HIGH for the Bull Put and
      Bear Put recalculated strike rows. The LL wording in AB6 OS M179/O179
      and M180/O180 is treated as a workbook copy-paste issue, not as the
      intended business rule.
    status: RESOLVED
  - id: s23_fsl_trp_row_184_mixed_mapping
    workbook_cells:
      - AB6 OS!I184
      - AB6 OS!Q184
      - AB6 OS!R184
      - AB6 OS!S184
      - AB6 OS!U184
      - AB6 OS!W184
    description: >
      S23 current-day FSL/TRP row 184 mixes labels from different branch
      families. The row text says "Recalcuate : Call Sell FSL / TRP : Bull /
      Bull CF", while the visible option-type cell shows Put and the populated
      R/S/U/W formulas structurally reference the Bull Put branch anchor A165.
    current_behavior: >
      TFIS now treats row 184 as a confirmed workbook-directed Bull/Bull CF
      Call FSL/TRP missed branch that intentionally switches into the Put-side
      Q/R/S/U/W formula family for current-day strike and premium handling.
    alternative_interpretation: >
      Treat row 184 as an intentional workbook-directed Bull Call missed-FSL
      context that transitions into the Bull Put current-day strike and premium
      family after the miss condition.
    resolution: >
      Confirmed implementation scope: row 184 is not treated as a blocker.
      TFIS should use row 184 exactly as the workbook gives it for the
      Bull/Bull CF Call FSL/TRP missed branch, including the visible Put-side
      Q/R/S/U/W formula family and the 09:29:59 AM HH + 7.00% FSL rule.
    status: RESOLVED
