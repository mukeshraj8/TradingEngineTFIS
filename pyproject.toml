[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingenginetfis"
version = "0.1.0"
description = "Lightweight TFIS rule-based trading engine skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml",
  "pandas",
  "openpyxl",
  "redis",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]
addopts = "--basetemp=.pytest_tmp"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


